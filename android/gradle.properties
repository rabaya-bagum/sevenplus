# Kept small so several builds can run side by side on a 2-core / 7 GB machine.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true

# Optional services (leave empty to disable). Same meaning as the iOS Info.plist keys.
sevenplus.supabaseUrl=
sevenplus.supabaseAnonKey=
sevenplus.sentryDsn=
sevenplus.privacyPolicyUrl=
